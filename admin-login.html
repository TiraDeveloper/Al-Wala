<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دخول الإدارة | شركة الوعلة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #0A1711; }
    .grid-bg {
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 46px 46px;
    }
  </style>
</head>
<body class="min-h-screen text-white overflow-hidden">
  <div class="fixed inset-0 grid-bg opacity-60 pointer-events-none"></div>
  <div class="fixed top-0 right-0 w-[420px] h-[420px] bg-yellow-500/10 blur-[120px] rounded-full pointer-events-none"></div>
  <div class="fixed bottom-0 left-0 w-[380px] h-[380px] bg-green-500/10 blur-[120px] rounded-full pointer-events-none"></div>

  <main class="min-h-screen flex items-center justify-center px-6 py-10">
    <div class="w-full max-w-md bg-white/[0.04] border border-white/10 rounded-[2rem] p-8 backdrop-blur-2xl shadow-2xl">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-yellow-500/10 border border-yellow-500/20 mb-4">
          <svg class="w-7 h-7 fill-yellow-400" viewBox="0 0 24 24">
            <path d="M12 1a5 5 0 0 0-5 5v2H6a3 3 0 0 0-3 3v8a4 4 0 0 0 4 4h10a4 4 0 0 0 4-4v-8a3 3 0 0 0-3-3h-1V6a5 5 0 0 0-5-5Zm-3 7V6a3 3 0 1 1 6 0v2H9Zm3 4a2 2 0 0 1 1 3.732V18a1 1 0 1 1-2 0v-2.268A2 2 0 0 1 12 12Z"/>
          </svg>
        </div>
        <h1 class="text-3xl font-black">تسجيل دخول الإدارة</h1>
        <p class="text-slate-400 mt-2 text-sm">بوابة خاصة بإدارة الموقع وعروض الأسعار</p>
      </div>

      <form id="adminLoginForm" class="space-y-5">
        <div>
          <label class="block text-sm font-bold text-slate-300 mb-2">اسم المستخدم</label>
          <input
            id="adminUsername"
            type="text"
            autocomplete="username"
            class="w-full rounded-2xl bg-[#08110d] border border-white/10 px-4 py-3 text-white outline-none focus:border-yellow-500/60"
            placeholder="أدخل اسم المستخدم"
          />
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-300 mb-2">كلمة المرور</label>
          <input
            id="adminPassword"
            type="password"
            autocomplete="current-password"
            class="w-full rounded-2xl bg-[#08110d] border border-white/10 px-4 py-3 text-white outline-none focus:border-yellow-500/60"
            placeholder="أدخل كلمة المرور"
          />
        </div>

        <div id="loginError" class="hidden rounded-2xl border border-red-500/20 bg-red-500/10 px-4 py-3 text-sm text-red-300 font-bold">
          اسم المستخدم أو كلمة المرور غير صحيحة
        </div>

        <button
          type="submit"
          class="w-full rounded-2xl bg-gradient-to-r from-yellow-500 to-yellow-400 text-[#0A1711] font-black py-3 shadow-lg shadow-yellow-500/20 hover:translate-y-[-2px] transition"
        >
          دخول الإدارة
        </button>

        <a
          href="index.html"
          class="block text-center rounded-2xl border border-white/10 py-3 font-bold text-slate-200 hover:border-yellow-500/40 hover:text-yellow-400 transition"
        >
          العودة للرئيسية
        </a>
      </form>
    </div>
  </main>

  <script>
    const ADMIN_USERNAME = "yamen";
    const ADMIN_PASSWORD = "20082008";
    const ADMIN_SESSION_KEY = "alwaala_admin_logged_in";

    const form = document.getElementById("adminLoginForm");
    const usernameInput = document.getElementById("adminUsername");
    const passwordInput = document.getElementById("adminPassword");
    const loginError = document.getElementById("loginError");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
        localStorage.setItem(ADMIN_SESSION_KEY, "true");
        window.location.href = "index.html";
      } else {
        loginError.classList.remove("hidden");
      }
    });
  </script>



</body>
</html>
